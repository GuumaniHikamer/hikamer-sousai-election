<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ヒカマーズ総裁選</title>
<style>body{font:16px system-ui;background:#10131b;color:#f5f7fb;max-width:760px;margin:auto;padding:20px}section{background:#1a2030;border:1px solid #30394d;border-radius:16px;padding:18px;margin:16px 0}label{display:flex;gap:12px;padding:12px;border:1px solid #30394d;border-radius:10px;margin:8px 0}button{width:100%;padding:14px;border:0;border-radius:10px;background:#7c9cff;font-weight:bold;margin-top:12px}.muted{color:#aeb8ca}.bar{height:8px;background:#30394d;margin:5px 0 12px}.fill{height:8px;background:#7c9cff}</style>
<h1>ヒカマーズ総裁選</h1><p class="muted">予選投票：1人につき日本時間で1日1票</p><section><h2>投票する</h2><p class="muted">投票制限のため、IPアドレスと日付から作成した秘密鍵付きハッシュ値を利用します。</p><form id="vote"><div id="candidates"></div><button>この候補に投票する</button><p id="status" role="status"></p></form></section>
<section><h2>投票結果</h2><div id="results">読み込み中…</div><button id="refresh" type="button">結果を更新</button></section>
<script>const cs=[{"id": "all_mania", "name": "all_mania（現 サ・カ・ナ）"}, {"id": "death_oyster", "name": "デス牡蠣（現「イ」とう）"}, {"id": "cocacola_fridge", "name": "コカ・コーラ自販機型冷蔵庫_mania（現 とうまマニア）"}, {"id": "chaimania", "name": "ちゃいまに"}, {"id": "mugcup_mania", "name": "マグカップ_mania"}, {"id": "nyn_aniki2", "name": "nyn姉貴2"}, {"id": "tsuru_mania", "name": "つる_mania"}, {"id": "shigaraki_kun", "name": "死柄キン"}, {"id": "konmania", "name": "こんまに"}, {"id": "gunmania", "name": "群馬ニア"}, {"id": "bun_sushi", "name": "ぶん🍣"}, {"id": "phony_mania", "name": "フォニイ_mania（現 小西綾乃_mania）"}, {"id": "cross_mania", "name": "十字架_mania（現 コ.ミ.ュ.ニ.ス.ト.ヤ.フ.ォ.ダ.）"}, {"id": "kohachi_mania", "name": "小八_mania"}];for(const c of cs){let l=document.createElement('label'),r=document.createElement('input'),s=document.createElement('span');r.type='radio';r.name='candidate';r.value=c.id;r.required=true;s.textContent=c.name;l.append(r,s);document.getElementById('candidates').append(l)}
async function load(){let o=document.getElementById('results');try{let r=await fetch('/api/results',{cache:'no-store'}),d=await r.json();if(!r.ok)throw 0;o.replaceChildren();let total=d.results.reduce((a,x)=>a+x.votes,0),max=Math.max(1,...d.results.map(x=>x.votes));let p=document.createElement('p');p.textContent='総投票数：'+total+'票';o.append(p);for(let c of cs){let x=d.results.find(y=>y.id===c.id)||{votes:0},n=document.createElement('div');n.textContent=c.name+' — '+x.votes+'票';let b=document.createElement('div'),f=document.createElement('div');b.className='bar';f.className='fill';f.style.width=x.votes/max*100+'%';b.append(f);o.append(n,b)}}catch{o.textContent='結果を取得できません。設定を確認してください。'}}
document.getElementById('vote').onsubmit=async e=>{e.preventDefault();let id=new FormData(e.currentTarget).get('candidate');if(!id||!confirm('この候補に投票しますか？'))return;let s=document.getElementById('status');s.textContent='送信中…';try{let r=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({candidateId:id})}),d=await r.json();s.textContent=d.message||d.error;if(r.ok)load()}catch{s.textContent='通信エラーです'}};document.getElementById('refresh').onclick=load;load();</script>
