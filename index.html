<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヒカマーズ総裁選・決選投票</title>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
body{font:16px system-ui;background:#10131b;color:#f5f7fb;max-width:760px;margin:auto;padding:20px}
section{background:#1a2030;border:1px solid #30394d;border-radius:16px;padding:18px;margin:16px 0}
label{display:flex;gap:12px;padding:12px;border:1px solid #30394d;border-radius:10px;margin:8px 0}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#7c9cff;font-weight:bold;margin-top:12px}
.muted{color:#aeb8ca}
.bar{height:8px;background:#30394d;margin:5px 0 12px}
.fill{height:8px;background:#7c9cff}
.turnstile{margin-top:16px}
</style>

<h1>ヒカマーズ総裁選・決選投票</h1>
<p class="muted">4人の中から2人を選択してください。1人につき日本時間で1日1回投票できます。</p>

<section>
<h2>決選投票</h2>
<p class="muted">2人を選択して投票してください。</p>

<form id="vote">
<div id="candidates"></div>

<div class="turnstile">
<div class="cf-turnstile"
data-sitekey="0x4AAAAAAFwnTLxXM1hqDd9P"
data-theme="dark"
data-size="flexible"
data-action="vote">
</div>
</div>

<button type="submit">この2人に投票する</button>
<p id="status" role="status"></p>
</form>
</section>

<section>
<h2>投票結果</h2>
<div id="results">読み込み中…</div>
<button id="refresh" type="button">結果を更新</button>
</section>

<script>
const cs=[
{"id":"all_mania","name":"all_mania（現 サ・カ・ナ）"},
{"id":"chaimania","name":"ちゃいまに"},
{"id":"cross_mania","name":"十字架_mania（現 コ.ミ.ュ.ニ.ス.ト.ヤ.フ.ォ.ダ.）"},
{"id":"konmania","name":"こんまに"}
];

for(const c of cs){
  let l=document.createElement('label'),
      r=document.createElement('input'),
      s=document.createElement('span');

  r.type='checkbox';
  r.name='candidate';
  r.value=c.id;

  s.textContent=c.name;

  l.append(r,s);
  document.getElementById('candidates').append(l);
}

async function load(){
  let o=document.getElementById('results');

  try{
    let r=await fetch('/api/results',{cache:'no-store'}),
        d=await r.json();

    if(!r.ok)throw 0;

    o.replaceChildren();

    let total=d.results.reduce((a,x)=>a+x.votes,0),
        max=Math.max(1,...d.results.map(x=>x.votes));

    let p=document.createElement('p');
    p.textContent='総選択数：'+total+'票';
    o.append(p);

    for(let c of cs){
      let x=d.results.find(y=>y.id===c.id)||{votes:0},
          n=document.createElement('div');

      n.textContent=c.name+' — '+x.votes+'票';

      let b=document.createElement('div'),
          f=document.createElement('div');

      b.className='bar';
      f.className='fill';
      f.style.width=x.votes/max*100+'%';

      b.append(f);
      o.append(n,b);
    }

  }catch{
    o.textContent='結果を取得できません。設定を確認してください。';
  }
}

document.getElementById('vote').onsubmit = async e => {
  e.preventDefault();

  const form = e.currentTarget;

  const ids = [...form.querySelectorAll('input[name="candidate"]:checked')]
    .map(input => input.value);

  const token = new FormData(form).get('cf-turnstile-response');
  const status = document.getElementById('status');
  const button = form.querySelector('button[type="submit"]');

  if (ids.length !== 2) {
    status.textContent = '2人を選択してください。';
    return;
  }

  if (!token) {
    status.textContent = 'セキュリティ検証を完了してください。';
    return;
  }

  if (!confirm('この2人に投票しますか？')) return;

  button.disabled = true;
  status.textContent = '送信中…';

  try {
    const r = await fetch('/api/vote', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        candidateIds: ids,
        turnstileToken: token
      })
    });

    const d = await r.json();

    status.textContent = d.message || d.error;

    if (r.ok) {
      await load();
    }

  } catch {
    status.textContent = '通信エラーです';

  } finally {
    if (window.turnstile) {
      window.turnstile.reset();
    }

    button.disabled = false;
  }
};

document.getElementById('refresh').onclick=load;

load();
</script>
</html>
